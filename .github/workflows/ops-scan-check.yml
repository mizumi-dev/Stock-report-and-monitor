name: ops-scan-check
# 一時的な確認用(ops/forward-peg-scan-checkブランチ専用、developにはマージしない)
on:
  push:
    branches: [ops/forward-peg-scan-check]
permissions:
  contents: read
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # 本番Lambdaのレイヤーと同じyfinanceのバージョンにそろえる
      - run: pip install "yfinance==1.5.2" pandas
      - run: python ops_check/collect.py 2>&1 | grep -E "^(ROW|DONE|yfinance)"; exit ${PIPESTATUS[0]}
        shell: bash
