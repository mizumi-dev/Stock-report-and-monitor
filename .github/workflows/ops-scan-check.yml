name: ops-scan-check
# 一時的な確認用(ops/forward-peg-scan-checkブランチ専用、developにはマージしない)
on:
  push:
    branches: [ops/forward-peg-scan-check]
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: python ops_check/scan_check.py 2>&1 | grep -vE "Unauthorized|Invalid Crumb|possibly delisted|No data found"; exit ${PIPESTATUS[0]}
        shell: bash
